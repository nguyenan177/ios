<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SongCho Download</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.card{
    width:430px;
    max-width:92%;
    background:white;
    border-radius:18px;
    padding:30px;
    box-shadow:0 15px 40px rgba(0,0,0,.3);
}

h1{
    text-align:center;
    color:#111827;
    margin-bottom:25px;
}

.item{
    background:#f3f4f6;
    border-radius:12px;
    padding:15px;
    margin-bottom:18px;
}

.title{
    font-weight:bold;
    margin-bottom:8px;
    color:#1f2937;
}

.link{
    color:#2563eb;
    word-break:break-all;
    margin-bottom:12px;
    font-size:14px;
}

button{
    width:100%;
    border:none;
    background:#2563eb;
    color:white;
    padding:12px;
    border-radius:10px;
    cursor:pointer;
    font-size:15px;
    transition:.2s;
}

button:hover{
    background:#1d4ed8;
}

#msg{
    margin-top:15px;
    text-align:center;
    color:#16a34a;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="card">

<h1>🍎 SongCho</h1>

<div class="item">
    <div class="title">📦 TrollStore</div>
    <div class="link">https://songcho.click/1.tipa</div>
    <button onclick="copy('https://songcho.click/1.tipa')">
        Sao chép Link TrollStore
    </button>
</div>

<div class="item">
    <div class="title">📱 Sileo Repo</div>
    <div class="link">https://songcho.click</div>
    <button onclick="copy('https://songcho.click')">
        Sao chép Link Sileo
    </button>
</div>

<div id="msg"></div>

</div>

<script>
function copy(text){
    navigator.clipboard.writeText(text).then(()=>{
        document.getElementById("msg").innerHTML="✅ Đã sao chép!";
        setTimeout(()=>{
            document.getElementById("msg").innerHTML="";
        },2000);
    });
}
</script>

</body>
</html>
