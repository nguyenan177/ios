<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SongCho</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    width:420px;
    max-width:100%;
    background:#fff;
    border-radius:20px;
    padding:28px;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

h1{
    text-align:center;
    color:#111827;
    margin-bottom:25px;
}

.item{
    background:#f5f5f5;
    border-radius:14px;
    padding:16px;
    margin-bottom:18px;
}

.title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:8px;
}

.link{
    color:#2563eb;
    font-size:14px;
    word-break:break-all;
    margin-bottom:15px;
}

button{
    width:100%;
    border:none;
    background:#2563eb;
    color:#fff;
    padding:13px;
    font-size:16px;
    border-radius:10px;
    cursor:pointer;
    transition:.2s;
}

button:active{
    transform:scale(.98);
}

#msg{
    text-align:center;
    margin-top:10px;
    color:#16a34a;
    font-weight:bold;
    min-height:22px;
}
</style>
</head>
<body>

<div class="card">

<h1>🍎 SongCho</h1>

<div class="item">
    <div class="title">📦 TrollStore</div>
    <div class="link">https://songcho.click/1</div>
    <button onclick="copyText('https://songcho.click/1.tipa')">
        Sao chép Link TrollStore
    </button>
</div>

<div class="item">
    <div class="title">📱 Sileo Repo</div>
    <div class="link">https://songcho.click</div>
    <button onclick="copyText('https://songcho.click')">
        Sao chép Link Sileo
    </button>
</div>

<div id="msg"></div>

</div>

<script>

function showMessage(text,color="#16a34a"){
    const msg=document.getElementById("msg");
    msg.style.color=color;
    msg.textContent=text;

    setTimeout(()=>{
        msg.textContent="";
    },2000);
}

function fallbackCopy(text){
    const textarea=document.createElement("textarea");

    textarea.value=text;
    textarea.setAttribute("readonly","");
    textarea.style.position="fixed";
    textarea.style.left="-9999px";

    document.body.appendChild(textarea);

    textarea.focus();
    textarea.select();
    textarea.setSelectionRange(0,99999);

    let ok=false;

    try{
        ok=document.execCommand("copy");
    }catch(e){}

    document.body.removeChild(textarea);

    if(ok){
        showMessage("✅ Đã sao chép!");
    }else{
        prompt("Không thể tự sao chép. Hãy nhấn Giữ → Sao chép",text);
    }
}

function copyText(text){

    if(navigator.clipboard && window.isSecureContext){

        navigator.clipboard.writeText(text)
        .then(()=>{
            showMessage("✅ Đã sao chép!");
        })
        .catch(()=>{
            fallbackCopy(text);
        });

    }else{

        fallbackCopy(text);

    }

}

</script>

</body>
</html>
